[package]
name = "sentinel_proxy_core"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "sentinel_proxy_core"
path = "src/main.rs"

[dependencies]
tokio          = { version = "1",  features = ["full"] }
hyper          = { version = "1",  features = ["full"] }
hyper-util     = { version = "0.1", features = ["full", "http2"] }
http-body-util = "0.1"
h2             = "0.4"
bytes          = "1"
rustls         = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls   = "0.26"
rcgen          = "0.13"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
chrono         = { version = "0.4", features = ["serde"] }
uuid           = { version = "1",  features = ["v4"] }
dashmap        = "6"
tokio-tungstenite = "0.24"
futures-util       = "0.3"
http               = "1"
tower              = "0.5"
tower-service      = "0.3"
tracing            = "0.1"
tracing-subscriber = "0.3"
anyhow             = "1"
flate2             = "1"
brotli             = "7"
regex              = "1"
webpki-roots       = "0.26"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
