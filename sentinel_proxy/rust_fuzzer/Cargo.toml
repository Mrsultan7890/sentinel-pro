[package]
name    = "sentinel_fuzzer"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "sentinel_fuzzer"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "blocking"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rayon       = "1"
urlencoding = "2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
