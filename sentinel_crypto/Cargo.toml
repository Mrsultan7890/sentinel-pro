[package]
name = "sentinel_crypto"
version = "1.0.0"
edition = "2021"

[dependencies]
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"
ring = "0.17"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

[lib]
name = "sentinel_crypto"
crate-type = ["cdylib", "rlib"]
